# Resource aliases for the risk tenant.
# Each alias maps to a set of env vars injected into the sandbox at runtime.
resource_aliases:
  mock-portfolio-db:
    DB_HOST: "localhost"
    DB_PORT: "5555"
    DB_USER: "reader"
    DB_PASS: ""
    DB_NAME: "portfolios"
    DB_ENGINE: "sqlite"
    DB_PATH: "/tmp/portfolio.db"
